[project]
name = "didyouhit"
version = "0.1.0"
description = "didyouhit.gg — weekly Arena stat challenges for a friend group"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "uvicorn",
    "sqlalchemy>=2",
    "alembic",
    "httpx",
    "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "respx", "ruff"]

[project.scripts]
didyouhit = "didyouhit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/didyouhit"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/ is the standalone Phase-1 probe, kept as-is on purpose
exclude = ["tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

